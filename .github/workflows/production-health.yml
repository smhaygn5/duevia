name: Duevia production health

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    name: Check public Arc health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Duevia and Arc Testnet
        env:
          HEALTH_URL: https://duevia.vercel.app/api/health/arc
        run: |
          response="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 20 "$HEALTH_URL")"
          echo "$response" | jq --exit-status '.ok == true and .network == "Arc Testnet" and .chainId == 5042002' >/dev/null
